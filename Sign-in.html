<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Home Sale</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="./index.html">🏠 Home Sale</a>
        <div class="d-flex gap-2">
            <a href="./index.html" class="btn btn-light">Home</a>
            <a href="./Account.html" class="btn btn-primary">Account</a>
            <a href="./Sign-in.html" class="btn btn-danger">Sign Out</a>
        </div>
    </div>
</nav>

<main class="container flex-grow-1 d-flex align-items-center justify-content-center py-5">
    <section class="card shadow-sm border-0" style="max-width: 430px; width: 100%;">
        <div class="card-body p-4 p-md-5">
            <h1 class="h3 fw-bold text-center mb-2">Welcome back</h1>
            <p class="text-muted text-center mb-4">Sign in to manage your Home Sale account.</p>

            <form action="./index.html" method="get">
                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">Email address</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="you@example.com" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold">Password</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                </div>

                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" id="remember" name="remember">
                    <label class="form-check-label" for="remember">Remember me</label>
                </div>

                <button type="submit" class="btn btn-success w-100">Sign In</button>
            </form>

            <p class="text-center text-muted small mt-4 mb-0">
                New to Home Sale? <a href="./Account.html">View your account</a>
            </p>
        </div>
    </section>
</main>

<footer class="bg-dark text-white text-center py-3">
    <p class="mb-0">© 2026 Home Sale | All Rights Reserved</p>
</footer>

</body>

</html>
