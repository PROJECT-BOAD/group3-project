<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Sign in to your Morrow account.">
	<title>Sign in | Morrow</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	<style>
		:root {
			--ink: #182320;
			--cream: #f6f2ea;
			--paper: #fcfaf6;
			--sage: #cdd8c7;
			--coral: #d9674e;
			--line: rgba(24, 35, 32, .14);
		}

		* { box-sizing: border-box; }
		body { background: var(--paper); color: var(--ink); font-family: 'Manrope', sans-serif; }
		.brand { color: var(--ink); font-size: 1.45rem; font-weight: 800; letter-spacing: -.08em; text-decoration: none; }
		.mono { font-family: 'DM Mono', monospace; font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; }
		.signin-page { min-height: 100vh; }
		.signin-art { background: linear-gradient(145deg, rgba(205, 216, 199, .3), rgba(205, 216, 199, .88)), url('https://images.unsplash.com/photo-1494438639946-1ebd1d20bf85?auto=format&fit=crop&w=1400&q=85') center/cover; min-height: 100vh; position: relative; }
		.art-note { background: var(--paper); bottom: 2rem; left: 2rem; padding: 1rem 1.1rem; position: absolute; width: 205px; }
		.signin-panel { max-width: 480px; padding: 2rem; width: 100%; }
		.eyebrow { color: var(--coral); font-weight: 800; }
		h1 { font-size: clamp(2.5rem, 5vw, 4.3rem); letter-spacing: -.07em; line-height: .96; }
		h1 em { font-family: 'Playfair Display', serif; font-weight: 600; }
		.form-label { font-size: .78rem; font-weight: 800; }
		.form-control { background: transparent; border: 1px solid var(--line); border-radius: 0; color: var(--ink); padding: .9rem 1rem; }
		.form-control:focus { background: var(--paper); border-color: var(--ink); box-shadow: 0 0 0 .2rem rgba(24, 35, 32, .1); }
		.form-control::placeholder { color: #78817b; }
		.form-check-label, .helper-link { color: #59645e; font-size: .78rem; }
		.helper-link { color: var(--ink); font-weight: 700; text-decoration: none; }
		.helper-link:hover { color: var(--coral); }
		.btn-morrow { background: var(--coral); border: 1px solid var(--coral); border-radius: 0; color: #fff; font-weight: 800; padding: .9rem 1.4rem; }
		.btn-morrow:hover { background: var(--ink); border-color: var(--ink); color: #fff; }
		.divider { align-items: center; color: #78817b; display: flex; font-size: .7rem; gap: .75rem; }
		.divider::before, .divider::after { background: var(--line); content: ''; flex: 1; height: 1px; }
		.btn-social { background: transparent; border: 1px solid var(--line); border-radius: 0; color: var(--ink); font-size: .8rem; font-weight: 700; padding: .8rem 1rem; }
		.btn-social:hover { background: var(--cream); border-color: var(--ink); }
		@media (max-width: 991px) {
			.signin-art { min-height: 300px; }
			.art-note { bottom: 1.25rem; left: 1.25rem; }
			.signin-panel { padding: 3rem 1.5rem; }
		}
	</style>
</head>
<body>
	<main class="signin-page row g-0">
		<section class="col-lg-6 signin-art d-flex align-items-end" aria-label="Morrow home collection">
			<div class="art-note">
				<span class="mono d-block mb-2">Welcome back</span>
				<strong>Make space for what matters.</strong>
			</div>
		</section>

		<section class="col-lg-6 d-flex flex-column align-items-center justify-content-center">
			<div class="signin-panel">
				<a class="brand d-inline-block mb-5" href="index.html">morrow<span style="color: var(--coral);">.</span></a>
				<p class="mono eyebrow mb-3">Your account</p>
				<h1 class="mb-3">Good to see <em>you.</em></h1>
				<p class="text-secondary mb-4">Sign in to pick up where you left off.</p>

				<form action="#" method="post">
					<div class="mb-3">
						<label class="form-label" for="email">Email address</label>
						<input class="form-control" id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
					</div>
					<div class="mb-3">
						<div class="d-flex justify-content-between align-items-center">
							<label class="form-label" for="password">Password</label>
							<a class="helper-link" href="#forgot-password">Forgot password?</a>
						</div>
						<input class="form-control" id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
					</div>
					<div class="form-check mb-4">
						<input class="form-check-input" id="remember" name="remember" type="checkbox">
						<label class="form-check-label" for="remember">Keep me signed in</label>
					</div>
					<button class="btn btn-morrow w-100" type="submit">Sign in <i class="bi bi-arrow-up-right ms-2"></i></button>
				</form>

				<div class="divider my-4">or continue with</div>
				<div class="row g-2">
					<div class="col-6"><button class="btn btn-social w-100" type="button"><i class="bi bi-google me-2"></i>Google</button></div>
					<div class="col-6"><button class="btn btn-social w-100" type="button"><i class="bi bi-apple me-2"></i>Apple</button></div>
				</div>
				<p class="text-center text-secondary small mt-4 mb-0">New to Morrow? <a class="helper-link" href="#create-account">Create an account</a></p>
			</div>
		</section>
	</main>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
