<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In | Home Sale</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

    <!-- ================= NAVBAR ================= -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand fw-bold" href="./Home-page.html">
                🏠 Home Sale
            </a>

            <div class="d-flex gap-2">

                <a href="./Home-page.html" class="btn btn-outline-light">
                    Home
                </a>

                <a href="./Account.html" class="btn btn-primary">
                    Account
                </a>

                <a href="./contact.html" class="btn btn-warning">
                    Contact
                </a>

            </div>

        </div>
    </nav>


    <!-- ================= SIGN IN ================= -->
    <section class="py-5">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-md-6 col-lg-5">

                    <div class="card shadow border-0">

                        <div class="card-body p-4 p-md-5">

                            <!-- Title -->
                            <div class="text-center mb-4">

                                <h2 class="fw-bold">
                                    Welcome Back 👋
                                </h2>

                                <p class="text-muted">
                                    Sign in to your Home Sale account
                                </p>

                            </div>


                            <!-- FORM -->
                            <form>

                                <!-- Email -->
                                <div class="mb-3">

                                    <label class="form-label">
                                        Email Address
                                    </label>

                                    <input
                                        type="email"
                                        class="form-control"
                                        placeholder="Enter your email"
                                        required>

                                </div>


                                <!-- Password -->
                                <div class="mb-3">

                                    <label class="form-label">
                                        Password
                                    </label>

                                    <input
                                        type="password"
                                        class="form-control"
                                        placeholder="Enter your password"
                                        required>

                                </div>


                                <!-- Remember -->
                                <div class="d-flex justify-content-between align-items-center mb-4">

                                    <div class="form-check">

                                        <input
                                            class="form-check-input"
                                            type="checkbox"
                                            id="remember">

                                        <label
                                            class="form-check-label"
                                            for="remember">

                                            Remember me

                                        </label>

                                    </div>


                                    <a href="#" class="text-decoration-none">
                                        Forgot Password?
                                    </a>

                                </div>


                                <!-- Sign In Button -->
                                <button
                                    type="submit"
                                    class="btn btn-primary w-100 py-2">

                                    Sign In

                                </button>

                            </form>


                            <!-- Create Account -->
                            <div class="text-center mt-4">

                                <p class="mb-0">

                                    Don't have an account?

                                    <a
                                        href="./Account.html"
                                        class="text-decoration-none fw-bold">

                                        Create Account

                                    </a>

                                </p>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>


    <!-- ================= FOOTER ================= -->
    <footer class="bg-dark text-white text-center py-4 fixed-bottom">

        <p class="mb-0">
            © 2026 Home Sale | All Rights Reserved
        </p>

    </footer>


    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
